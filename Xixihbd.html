<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{color:#542e29;background:#ffeec9;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent;transform:translateZ(0);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}button:not(:disabled):active{transform:scale(.9)}button:disabled{cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #98512b;outline-offset:4px}
#book{height:100%;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:radial-gradient(ellipse at 15% 22%,#fff9df,transparent 50%),radial-gradient(ellipse at 95% 77%,#ffc997,transparent 59%),#ffedc8;position:relative;overflow:hidden}
header,footer{width:min(100%,680px);margin:auto;display:flex;align-items:center;justify-content:space-between;padding:16px 25px;position:relative;z-index:3}header{padding-top:max(18px,env(safe-area-inset-top));font:italic bold 19px Georgia,serif;color:#a64636}header span:last-child{font:12px monospace;letter-spacing:.14em}main{overflow:auto;overscroll-behavior:contain;display:flex;position:relative;z-index:2}article{width:min(100%,580px);margin:auto;padding:22px 28px;text-align:center;animation:arrive .45s ease both}h1,h2{font-family:Georgia,"Songti SC","STSong",serif;line-height:1.35;margin:10px 0 18px}h1{font-size:clamp(33px,6vw,55px)}h2{font-size:clamp(27px,5vw,42px)}p{line-height:1.8;margin:12px 0;font-size:clamp(16px,2.8vw,20px)}.salute{font-family:Georgia,"Songti SC",serif;font-size:24px;letter-spacing:.15em;margin-bottom:0}.num{font:italic bold 1.8em Georgia,serif;color:#b54836;white-space:nowrap}header:after{content:"";height:1px;background:#b258393a;position:absolute;left:0;right:0;top:57px}.ambient{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}.ambient-item{position:absolute;left:var(--left);top:var(--top);font-size:var(--size);opacity:.22;filter:saturate(.78);animation:ambient-drift var(--time) var(--wait) ease-in-out infinite}.ambient-item.ribbon{font-family:Georgia,serif;font-weight:bold;color:#be5c55;opacity:.28}.cover{position:relative}.cake{position:relative;width:260px;height:205px;margin:12px auto 4px}.plate,.layer,.candle,.icing,.berry,.spark{position:absolute}.plate{bottom:13px;left:8%;width:84%;height:26px;background:#fef6de;border-radius:50%;border-bottom:5px solid #9da98b;box-shadow:0 7px 9px #ac62222b}.layer{left:15%;bottom:30px;width:70%;height:84px;border-radius:50% / 18%;background:repeating-linear-gradient(to bottom,#dc805a 0 15px,#ffcd92 16px 31px,#ffebbd 32px 40px);box-shadow:inset -15px -2px 15px #a45b3833}.icing{left:15%;width:70%;height:37px;bottom:88px;border-radius:50%;background:#fffaeb;box-shadow:0 6px #f8d9ac}.icing:after{content:"";position:absolute;background:#fffaeb;width:11px;height:17px;top:23px;left:24px;border-radius:9px;box-shadow:31px 6px #fffaeb,90px 3px #fffaeb}.candle{bottom:117px;left:50%;transform:translateX(-50%);font:bold 51px/1 Georgia;color:#dd6954;text-shadow:2px 2px #9c4739,-1px -1px #fff}.candle:before,.candle:after{content:"";position:absolute;top:-15px;left:9px;width:9px;height:17px;background:#ffb433;border-radius:80% 15% 70% 50%;box-shadow:0 0 14px #ffcc61;animation:flicker 1.5s infinite alternate}.candle:after{left:37px}.berry{bottom:107px;left:57px;width:19px;height:21px;border-radius:55% 55% 65% 65%;background:radial-gradient(at 35% 30%,#ffe9c7 1px,transparent 2px),#cd5849;transform:rotate(-16deg)}.berry.b{left:auto;right:54px;transform:rotate(17deg)}.spark{color:#b8873c;font:30px Georgia;top:45px;left:20px}.spark.r{left:auto;right:16px;top:70px;font-size:20px}
footer{justify-content:center;gap:18px;min-height:55px;padding-bottom:max(16px,env(safe-area-inset-bottom))}.nav{background:transparent;border:0;padding:10px 14px;font-size:14px}.next{color:#8a3f32}.back{position:absolute;left:max(5px,calc(50% - 310px));font-size:19px}.primary,.secondary{padding:12px 20px;border-radius:24px;border:1px solid #ba7152;background:linear-gradient(145deg,#a24e3b,#883a30);color:#fff8e3;box-shadow:0 6px 14px #87412c2b,inset 0 1px #ffffff4d}.primary:not(:disabled):hover,.secondary:not(:disabled):hover{filter:brightness(1.04);box-shadow:0 8px 18px #87412c36,inset 0 1px #ffffff5c}.secondary{background:linear-gradient(145deg,#fffaf0,#f7e5c4);color:#793f33}.secondary:disabled{opacity:.76;box-shadow:inset 0 1px #fff}.button-pop{animation:button-pop .34s cubic-bezier(.22,.8,.3,1) both!important}form{display:grid;gap:12px;justify-items:center;margin:24px auto 0;max-width:340px}input,textarea{width:100%;padding:13px 16px;background:#fffaea;border:1px solid #c58f65;border-radius:12px;color:#522d28}textarea{resize:vertical;min-height:95px}.msg{font-size:15px;color:#923c2d;min-height:1.5em}.choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.reveal{animation:appear .36s both;animation-delay:var(--delay)}.photos{position:relative;height:clamp(250px,65vw,365px);margin:22px auto}.photo{position:absolute;left:50%;top:50%;width:min(82vw,400px);aspect-ratio:4/3;height:auto;border:9px solid #fff9eb;border-bottom-width:25px;background:linear-gradient(150deg,#f6d59a,#d7ad7b);display:grid;place-items:center;color:#805338;font:italic 20px Georgia;box-shadow:0 4px 12px #69402333;transform:translate(-50%,-50%) rotate(var(--r));animation:stack .7s var(--delay) both}.photo img,.snapshot img{height:100%;width:100%;object-fit:cover}.snapshot{margin:16px auto;width:min(75%,280px);height:160px;border:8px solid #fff8e9;background:#eac798;display:grid;place-items:center;color:#81573c;transform:rotate(-3deg);box-shadow:0 4px 12px #69402327}.stats-stream{display:grid;gap:9px;width:min(100%,390px);margin:16px auto}.stat-card{display:grid;grid-template-columns:1fr auto auto;align-items:baseline;gap:7px;margin:0;padding:11px 17px;text-align:left;background:#fff7e5c9;border:1px solid #cb93665e;border-radius:16px;box-shadow:0 5px 14px #8e54251c;backdrop-filter:blur(4px)}.stat-card strong{font:italic bold 31px Georgia;color:#a94332}.stat-unit{font-size:14px;color:#8b5746}.stat-arrive{animation:stat-arrive .38s cubic-bezier(.2,.8,.2,1) both}.report-prompt{margin-top:4px}.report-prompt.complete{color:#7c5341}.tree{position:relative;margin:15px auto;width:180px;height:185px;background:linear-gradient(#9b6241,#9b6241) center bottom/19px 42px no-repeat}.tree:before{content:"";position:absolute;inset:18px 5px 22px;background:repeating-linear-gradient(162deg,#47745a 0 25px,#d7b675 26px 28px,#49755b 29px 46px);clip-path:polygon(50% 0,75% 35%,66% 35%,89% 68%,78% 68%,100% 100%,0 100%,22% 68%,11% 68%,34% 35%,25% 35%)}.tree:after{content:"★";position:absolute;top:-1px;left:calc(50% - 12px);color:#c48e26;font-size:24px}.letter{position:absolute;z-index:1;left:50%;top:55%;max-width:160px;width:max-content;padding:12px;background:#fff9e4;box-shadow:0 3px 8px #70462033;transform:translateX(-50%);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;animation:fold 3s both}.env{position:absolute;z-index:2;top:50%;left:51%;font:42px/1 Georgia;color:#fbdfad;text-shadow:0 2px 2px #584532;animation:mail 3s both}.finish{font:italic 22px Georgia;color:#976746}
@keyframes arrive{from{opacity:0;transform:translateY(13px)}}@keyframes appear{from{opacity:0;transform:translateY(8px)}}@keyframes stat-arrive{from{opacity:0;transform:translateY(12px) scale(.96)}}@keyframes button-pop{0%{transform:scale(1)}35%{transform:scale(.88)}72%{transform:scale(1.07)}100%{transform:scale(1)}}@keyframes ambient-drift{0%,100%{transform:translate3d(0,0,0) rotate(-5deg)}50%{transform:translate3d(var(--dx),var(--dy),0) rotate(9deg)}}@keyframes flicker{to{transform:rotate(10deg) scale(.9)}}@keyframes stack{from{opacity:0;transform:translate(-50%,-85%) rotate(-15deg)}}@keyframes fold{0%,37%{opacity:1;transform:translate(-50%,-45%) scale(1)}65%,100%{opacity:0;transform:translate(-50%,0) scale(.2)}}@keyframes mail{0%,27%{opacity:0;transform:translate(140px,50px) scale(1.5)}52%,69%{opacity:1;transform:translate(-50%,0) scale(1.5)}100%{transform:translate(-5%,-40%) rotate(12deg) scale(.66)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important}.ambient-item{animation:none!important}}
